name: ci
on:
  # Branches run once, as a pull request; main and the nightly run fuzz
  # longer.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      # ExifTool, pinned: the tests that check this package agrees with it
      # skip without it, and must not here. From SourceForge, which keeps
      # every version; the SHA-256 is exiftool.org's (checksums.txt).
      - name: ExifTool
        env:
          EXIFTOOL_VERSION: "13.63"
          EXIFTOOL_SHA256: c6438851b971886f2eb35426ea5bc8960f34ae4eddeca3198a57af5b0ad49cbd
        run: |
          curl -fsSL -o "$RUNNER_TEMP/exiftool.tar.gz" \
            "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-$EXIFTOOL_VERSION.tar.gz/download"
          echo "$EXIFTOOL_SHA256  $RUNNER_TEMP/exiftool.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/exiftool.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/Image-ExifTool-$EXIFTOOL_VERSION" >> "$GITHUB_PATH"
      - name: Tests
        shell: bash
        run: |
          exiftool -ver
          go test -race -v ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: No ExifTool test skipped
        shell: bash
        run: |
          if grep -n "exiftool not installed" "$RUNNER_TEMP/test.log"; then
            echo "::error::a test that checks agreement with ExifTool was skipped"
            exit 1
          fi
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One target per line, so that pull requests adding one don't conflict.
        target:
          - FuzzReadOrientation
          - FuzzSetRotation
          - FuzzPlanRotation
          - FuzzReadExif
          - FuzzEditExif
          - FuzzReadRAW
          - FuzzChunked
          - FuzzJPEGExif
          - FuzzEditXMP
          - FuzzJPEGXMP
          - FuzzReadVideo
          - FuzzVideoOrientation
          - FuzzPlanItems
          - FuzzIPTC
          - FuzzPlanXMPEdit
          - FuzzPlanMetadata
          - FuzzVideoEdit
          - FuzzReadEmbedded
          - FuzzReadPreviews
          - FuzzReadJXL
          - FuzzUnbrob
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # 2 minutes per target on a pull request, 10 on main, 30 nightly.
      # A failing input is minimized for at most 10 s: left unbounded, the
      # minimizing can take the rest of the run, which then looks stalled.
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime ${{ github.event_name == 'pull_request' && '2m' || github.event_name == 'schedule' && '30m' || '10m' }} -fuzzminimizetime 10s .
      # A failing input is written under testdata/fuzz/<target>/: keep the
      # new ones, so the failure can be reproduced (go test -run
      # <target>/<name>) and the input committed as a regression test.
      - name: Collect new failing inputs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-inputs"
          git ls-files --others --exclude-standard -z -- 'testdata/fuzz/${{ matrix.target }}/' |
            xargs -0 -r cp --parents -t "$RUNNER_TEMP/fuzz-inputs"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-failing-input-${{ matrix.target }}
          path: ${{ runner.temp }}/fuzz-inputs/
          if-no-files-found: ignore
          retention-days: 30
  bench:
    # Compares the benchmarks of the pull request against its base, run
    # interleaved on one runner, and fails on a clear regression (see
    # .github/benchgate).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build both test binaries
        run: |
          git worktree add -q "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          go test -c -o "$RUNNER_TEMP/head.test" .
          (cd "$RUNNER_TEMP/base" && go test -c -o "$RUNNER_TEMP/base.test" .)
      - name: Run interleaved
        run: |
          bench() { "$1" -test.run '^$' -test.bench . -test.benchmem -test.benchtime 200ms -test.count 1; }
          for i in $(seq 8); do
            (cd "$RUNNER_TEMP/base" && bench "$RUNNER_TEMP/base.test") >> "$RUNNER_TEMP/base.txt"
            bench "$RUNNER_TEMP/head.test" >> "$RUNNER_TEMP/head.txt"
          done
      - run: go run ./.github/benchgate "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt"
